name: install-networkspy-latest
type: shell
commands:
  - echo "NetworkSpy cache key ${NETWORKSPY_CACHE_BUST:-local}"

  - apt-get update

  - apt-get install -y --no-install-recommends ca-certificates curl jq

  - ARCH="$(dpkg --print-architecture)"

  - case "$ARCH" in amd64|arm64) ;; *) echo "Unsupported architecture $ARCH"; exit 1 ;; esac

  - curl -fL --retry 5 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/NetworkSpyHQ/NetworkSpy/releases?per_page=30" -o /tmp/networkspy-releases.json

  - >-
      URL="$(jq -er --arg suffix "_${ARCH}.deb"
      '[.[] | select(.draft == false) | . as $release |
      .assets[]? | select(.name | endswith($suffix)) |
      {url: .browser_download_url, published: $release.published_at}]
      | sort_by(.published) | reverse | .[0].url'
      /tmp/networkspy-releases.json)"

  - echo "Downloading $URL"

  - curl -fL --retry 5 "$URL" -o /tmp/networkspy.deb

  - PACKAGE="$(dpkg-deb -f /tmp/networkspy.deb Package)"

  - VERSION="$(dpkg-deb -f /tmp/networkspy.deb Version)"

  - echo "Installing $PACKAGE version $VERSION"

  - apt-get install -y --allow-downgrades /tmp/networkspy.deb

  - INSTALLED_VERSION="$(dpkg-query -W -f='${Version}' "$PACKAGE")"

  - test "$INSTALLED_VERSION" = "$VERSION"

  - echo "Installed $PACKAGE $INSTALLED_VERSION"

  - rm -f /tmp/networkspy.deb /tmp/networkspy-releases.json