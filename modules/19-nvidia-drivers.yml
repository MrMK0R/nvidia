  - name: nvidia-latest-driver
    type: shell
    commands:
      - apt update
      - apt -y install ca-certificates wget gnupg software-properties-common linux-headers-amd64
      - add-apt-repository -y contrib || true
      - wget -O /tmp/cuda-keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64/cuda-keyring_1.1-1_all.deb
      - dpkg -i /tmp/cuda-keyring.deb
      - apt update
      - apt -V -y install nvidia-open nvidia-settings