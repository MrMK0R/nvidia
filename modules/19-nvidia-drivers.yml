name: nvidia-official-repo
type: shell

sources:
  - type: file
    url: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/cuda-keyring_1.1-1_all.deb

commands:
  - >-
    test -s /sources/nvidia-official-repo/cuda-keyring_1.1-1_all.deb

  - >-
    dpkg -i /sources/nvidia-official-repo/cuda-keyring_1.1-1_all.deb

  - >-
    test -f /etc/apt/sources.list.d/cuda-debian12-x86_64.list

  - >-
    sed -i 's/signed-by=/signed-by=/; s/] / allow-insecure=yes] /' /etc/apt/sources.list.d/cuda-debian12-x86_64.list

  - >-
    printf '%s\n' 'APT::Key::GPGVCommand "/usr/bin/gpgv";' > /etc/apt/apt.conf.d/99-nvidia-gpgv

  - >-
    apt-get update

  - >-
    rm -f /etc/apt/apt.conf.d/99-nvidia-gpgv