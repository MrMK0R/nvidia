name: cleanup
type: shell
commands:
  - '[ -f /usr/share/applications/display-im7.q16.desktop ] && sed -i "/^Categories=/ s/$/Utility;X-GNOME-Utilities;/" /usr/share/applications/display-im7.q16.desktop || true'
  - apt remove -y dpkg-dev debhelper-compat dh-sequence-gnome libglib2.0-dev meson build-essential debhelper libadwaita-1-dev gettext make libjpeg-dev libnm-dev libnma-gtk4-dev papers || true
  - apt autoremove -y || true
  - apt clean || true
  - apt remove -y zutty gnome-shell-extension-prefs || true
  - SUDO_FORCE_REMOVE=yes apt purge -y sudo || true
  - '[ -f /usr/share/applications/software-properties-gtk.desktop ] && echo "NoDisplay=true" >> /usr/share/applications/software-properties-gtk.desktop || true'