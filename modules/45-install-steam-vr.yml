name: install-steam
type: shell

sources:
  - type: file
    url: https://cdn.fastly.steamstatic.com/client/installer/steam.deb

commands:
  # Verify architecture and downloaded package.
  - test "$(dpkg --print-architecture)" = "amd64"
  - test -s /sources/install-steam/steam/install-steam.deb

  # Enable 32-bit package support.
  - dpkg --add-architecture i386

  # Keep Vanilla repositories amd64-only.
  - >-
    test -s /etc/apt/sources.list.d/vanilla-base.sources &&
    sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64'
    /etc/apt/sources.list.d/vanilla-base.sources

  # Remove stale i386 repository definitions.
  - rm -f /etc/apt/sources.list.d/debian-i386.sources
  - rm -f /etc/apt/sources.list.d/vanilla-i386.sources

  # Configure Debian snapshot for Steam dependencies.
  - >-
    printf '%s\n'
    'Types: deb'
    'URIs: https://snapshot.debian.org/archive/debian/20261023T000000Z/'
    'Suites: sid'
    'Components: main contrib non-free non-free-firmware'
    'Architectures: amd64 i386'
    'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg'
    'Check-Valid-Until: no'
    > /etc/apt/sources.list.d/steam-debian.sources

  # Refresh package metadata.
  - apt-get update

  # Synchronize libgcc versions across architectures.
  - >-
    apt-get install -y --allow-downgrades
    libgcc-s1:amd64=16.2.0-3
    libgcc-s1:i386=16.2.0-3

  # Install Steam 32-bit compatibility libraries.
  - apt-get install -y --no-install-recommends steam-libs-i386:i386

  # Install Steam with dependency resolution.
  - >-
    apt-get install -y --no-install-recommends
    /sources/install-steam/steam/install-steam.deb

  # Verify Steam installation.
  - test "$(dpkg-query -W -f='${db:Status-Status}' steam-launcher)" = "installed"

  # Remove temporary Debian repository.
  - rm -f /etc/apt/sources.list.d/steam-debian.sources