name: install-steam
type: shell

sources:
  - type: file
    url: https://cdn.fastly.steamstatic.com/client/installer/steam.deb

commands:
  # Verify architecture and package.
  - test "$(dpkg --print-architecture)" = "amd64"
  - test -s /sources/install-steam/steam/install-steam.deb

  # Enable 32-bit architecture.
  - dpkg --add-architecture i386

  # Keep Vanilla OS repositories amd64-only.
  - >-
    test -f /etc/apt/sources.list.d/vanilla-base.sources &&
    sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64'
    /etc/apt/sources.list.d/vanilla-base.sources

  # Remove old i386 repository definitions.
  - rm -f /etc/apt/sources.list.d/debian-i386.sources
  - rm -f /etc/apt/sources.list.d/vanilla-i386.sources

  # Use Debian snapshot with matching GCC runtime packages.
  - >-
    printf '%s\n'
    'Types: deb'
    'URIs: https://snapshot.debian.org/archive/debian/20261114T000000Z/'
    'Suites: sid'
    'Components: main contrib non-free non-free-firmware'
    'Architectures: i386'
    'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg'
    'Check-Valid-Until: no'
    > /etc/apt/sources.list.d/steam-debian.sources

  # Refresh repositories.
  - apt-get update

  # Install the matching 32-bit GCC runtime.
  - >-
    apt-get install -y --no-install-recommends
    gcc-16-base:i386=16.2.0-4
    libgcc-s1:i386=16.2.0-4

  # Verify runtime versions match the host.
  - >-
    test "$(dpkg-query -W -f='${Version}' libgcc-s1:amd64)"
    = "$(dpkg-query -W -f='${Version}' libgcc-s1:i386)"

  # Install Steam 32-bit dependencies.
  - >-
    apt-get install -y --no-install-recommends
    steam-libs-i386:i386

  # Install Steam.
  - >-
    apt-get install -y --no-install-recommends
    /sources/install-steam/steam/install-steam.deb

  # Verify installation.
  - >-
    test "$(dpkg-query -W -f='${db:Status-Status}'
    steam-launcher)" = "installed"

  # Verify architecture synchronization.
  - >-
    test "$(dpkg-query -W -f='${Version}' libgcc-s1:amd64)"
    = "$(dpkg-query -W -f='${Version}' libgcc-s1:i386)"

  # Clean temporary repository.
  - rm -f /etc/apt/sources.list.d/steam-debian.sources