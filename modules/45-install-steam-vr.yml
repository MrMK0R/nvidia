name: install-steam-vr
type: shell

commands:
  - 'test "$(dpkg --print-architecture)" = "amd64"'
  - dpkg --add-architecture i386
  - apt-get update
  - 'echo "steam steam/question select I AGREE" | debconf-set-selections'
  - 'echo "steam steam/license note" | debconf-set-selections'
  - 'NVIDIA_VERSION="$(dpkg-query -W -f=''${Version}'' nvidia-driver-libs)" && DEBIAN_FRONTEND=noninteractive apt-get install -y steam-installer steam-devices "nvidia-driver-libs:i386=${NVIDIA_VERSION}" "nvidia-vulkan-icd:i386=${NVIDIA_VERSION}" wayland-utils vulkan-tools'
  - apt-get clean
  - rm -rf /var/lib/apt/lists/*