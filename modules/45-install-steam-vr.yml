name: install-steam-vr
type: shell

commands:
  - 'test "$(dpkg --print-architecture)" = "amd64"'
  - dpkg --add-architecture i386
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl wayland-utils vulkan-tools
  - curl -fsSL https://repo.steampowered.com/steam/steam.gpg -o /usr/share/keyrings/steam.gpg
  - 'printf "%s\n" "deb [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam" > /etc/apt/sources.list.d/steam-stable.list'
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y steam-launcher
  - apt-get clean