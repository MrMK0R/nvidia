name: install-steam-vr
type: shell

commands:
  - test "$(dpkg --print-architecture)" = "amd64"

  # Enable Steam's required 32-bit libraries.
  - dpkg --add-architecture i386
  - apt-get update

  # Accept the Steam package licence.
  - echo 'steam steam/question select I AGREE' | debconf-set-selections
  - echo 'steam steam/license note' | debconf-set-selections

  # Install native Steam, Vive rules and VR diagnostic tools.
  - apt-get install -y steam-installer steam-devices nvidia-driver-libs:i386 nvidia-vulkan-icd:i386 wayland-utils vulkan-tools

  - apt-get clean