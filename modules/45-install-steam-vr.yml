name: install-steam-vr
type: shell

commands:
  # Build-safe only:
  # Do not enable i386 during the image build.
  # Do not install Steam during the image build.
  # Do not install nvidia-driver-libs:i386 during the image build.
  # Those are the pieces causing APT exit 100 in Docker Buildx.
  - apt-get -o Acquire::Retries=5 update
  - DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends ca-certificates curl wayland-utils vulkan-tools
  - 'DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends steam-devices || true'
  - 'printf "%s\n" "#!/usr/bin/env bash" "set -euo pipefail" "if [ \"\$(id -u)\" -ne 0 ]; then" "  echo \"Run with: pkexec install-steamvr-runtime\" >&2" "  exit 1" "fi" "install -d -m 0755 /usr/share/keyrings" "curl -fsSL https://repo.steampowered.com/steam/steam.gpg -o /usr/share/keyrings/steam.gpg" "printf \"%s\n\" \"deb [arch=amd64,i386 signed-by=/usr/share/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam\" > /etc/apt/sources.list.d/steam-stable.list" "dpkg --add-architecture i386" "apt-get -o Acquire::Retries=5 update" "DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y steam-launcher steam-devices" > /usr/local/bin/install-steamvr-runtime'
  - chmod 0755 /usr/local/bin/install-steamvr-runtime
  - apt-get clean