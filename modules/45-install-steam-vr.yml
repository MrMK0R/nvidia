name: install-steam
type: shell

sources:
  - type: file
    url: https://cdn.fastly.steamstatic.com/client/installer/steam.deb

commands:
  # Verify build architecture and Steam package.
  - test "$(dpkg --print-architecture)" = "amd64"
  - test -s /sources/install-steam/steam/install-steam.deb

  # Enable Steam's 32-bit architecture.
  - dpkg --add-architecture i386

  # Restrict Vanilla OS repositories to amd64.
  - >-
    test -f /etc/apt/sources.list.d/vanilla-base.sources &&
    sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64'
    /etc/apt/sources.list.d/vanilla-base.sources

  # Remove conflicting i386 repository definitions.
  - rm -f /etc/apt/sources.list.d/debian-i386.sources
  - rm -f /etc/apt/sources.list.d/vanilla-i386.sources

  # Debian snapshot repository.
  - >-
    printf '%s\n'
    'Types: deb'
    'URIs: https://snapshot.debian.org/archive/debian/20261023T000000Z/'
    'Suites: sid'
    'Components: main contrib non-free non-free-firmware'
    'Architectures: amd64 i386'
    'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg'
    'Check-Valid-Until: no'
    > /etc/apt/sources.list.d/steam-debian.sources

  # Force matching libgcc versions for both architectures.
  - >-
    printf '%s\n'
    'Package: libgcc-s1'
    'Pin: version 16.2.0-3'
    'Pin-Priority: 1001'
    > /etc/apt/preferences.d/steam-libgcc

  # Refresh repositories.
  - apt-get update

  # Install matching libgcc packages.
  - >-
    apt-get install -y --allow-downgrades
    libgcc-s1:amd64=16.2.0-3
    libgcc-s1:i386=16.2.0-3

  # Verify amd64 and i386 are synchronized.
  - >-
    test "$(dpkg-query -W -f='${Version}' libgcc-s1:amd64)"
    = "16.2.0-3"

  - >-
    test "$(dpkg-query -W -f='${Version}' libgcc-s1:i386)"
    = "16.2.0-3"

  # Install Steam 32-bit dependencies.
  - >-
    apt-get install -y --no-install-recommends
    steam-libs-i386:i386

  # Install Steam launcher.
  - >-
    apt-get install -y --no-install-recommends
    /sources/install-steam/steam/install-steam.deb

  # Verify Steam is installed.
  - >-
    test "$(dpkg-query -W -f='${db:Status-Status}'
    steam-launcher)" = "installed"

  # Verify both libgcc architectures remain synchronized.
  - >-
    test "$(dpkg-query -W -f='${Version}' libgcc-s1:amd64)"
    = "$(dpkg-query -W -f='${Version}' libgcc-s1:i386)"

  # Remove temporary Steam repository and pin.
  - rm -f /etc/apt/sources.list.d/steam-debian.sources
  - rm -f /etc/apt/preferences.d/steam-libgcc