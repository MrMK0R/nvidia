name: latest-mutter
type: shell

commands:
  - echo "deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260820T000000Z/ forky main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/debian-forky.list

  - apt-get update

  - 'version="$(apt-cache policy mutter | awk "/Candidate:/ {print \$2}")"; dpkg --compare-versions "$version" ge 50.3 || { echo "ERROR: Mutter 50.3 or newer is required; candidate is $version"; exit 1; }'

  - apt-get install -y --no-install-recommends mutter mutter-common mutter-common-bin libmutter-18-0 gir1.2-mutter-18

  - 'installed="$(dpkg-query -W -f="${Version}" mutter)"; dpkg --compare-versions "$installed" ge 50.3 || { echo "ERROR: Installed Mutter is older than 50.3"; exit 1; }'

  - apt-cache policy mutter libmutter-18-0 libc6 libc-bin

  - rm -f /etc/apt/sources.list.d/debian-forky.list

  - apt-get update
