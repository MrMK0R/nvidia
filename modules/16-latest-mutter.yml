name: latest-mutter
type: shell

commands:
  - >-
    set -eu;
    REPO_FILE="/etc/apt/sources.list.d/debian-forky-snapshot.list";
    cleanup() { rm -f "$REPO_FILE"; rm -f /var/lib/apt/lists/*snapshot.debian.org*; };
    trap cleanup EXIT;
    trap 'exit 1' HUP INT TERM;
    printf '%s\n' 'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260820T000000Z/ forky main contrib non-free non-free-firmware' > "$REPO_FILE";
    echo "Configured Debian Forky snapshot.";
    update_success=0;
    for attempt in 1 2 3 4 5; do
    if apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=3 update; then
    update_success=1;
    echo "APT indexes updated successfully.";
    break;
    fi;
    if [ "$attempt" -lt 5 ]; then
    delay=$((attempt * 10));
    echo "APT update failed. Retrying in ${delay} seconds...";
    sleep "$delay";
    fi;
    done;
    if [ "$update_success" -ne 1 ]; then
    echo "ERROR: APT update failed after 5 attempts.";
    exit 1;
    fi;
    set --;
    for package in mutter mutter-common mutter-common-bin libmutter-18-0 gir1.2-mutter-18; do
    version="$(apt-cache policy "$package" | awk '/Candidate:/ {print $2; exit}')";
    if [ -z "$version" ] || [ "$version" = "(none)" ]; then
    echo "ERROR: No installation candidate for $package.";
    exit 1;
    fi;
    if ! dpkg --compare-versions "$version" ge "50.3"; then
    echo "ERROR: $package requires version 50.3 or newer. Candidate: $version";
    exit 1;
    fi;
    echo "$package candidate: $version";
    set -- "$@" "$package=$version";
    done;
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$@";
    installed="$(dpkg-query -W -f='${Version}' mutter)";
    if ! dpkg --compare-versions "$installed" ge "50.3"; then
    echo "ERROR: Installed Mutter is below 50.3: $installed";
    exit 1;
    fi;
    echo "Successfully installed Mutter $installed";
    apt-cache policy mutter libmutter-18-0 libc6 libc-bin;
    echo "Mutter installation completed successfully."