name: latest-mutter
type: shell
commands:
  - echo "deb http://deb.debian.org/debian experimental main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/debian-experimental.list
  - 'printf "%s\n" "Package: *" "Pin: release a=experimental" "Pin-Priority: 1" "" "Package: mutter mutter-common mutter-common-bin libmutter-* gir1.2-mutter-* gnome-shell gnome-shell-common gnome-shell-extension-prefs gsettings-desktop-schemas" "Pin: release a=experimental" "Pin-Priority: 990" > /etc/apt/preferences.d/90-mutter-experimental'
  - apt update
  - apt -y -t experimental install mutter gnome-shell gnome-shell-common gnome-shell-extension-prefs