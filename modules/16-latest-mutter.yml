name: latest-mutter
type: shell
commands:
  - echo "deb http://deb.debian.org/debian forky main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/debian-forky.list
  - 'printf "%s\n" "Package: *" "Pin: release n=forky" "Pin-Priority: 1" "" "Package: mutter mutter-common mutter-common-bin libmutter-18-0 gir1.2-mutter-18" "Pin: release n=forky" "Pin-Priority: 990" > /etc/apt/preferences.d/90-mutter-forky'
  - apt update
  - apt -y --no-install-recommends install mutter mutter-common mutter-common-bin libmutter-18-0 gir1.2-mutter-18
  - apt-cache policy mutter libc6 libc-bin
  - rm -f /etc/apt/sources.list.d/debian-forky.list /etc/apt/preferences.d/90-mutter-forky
  - apt update