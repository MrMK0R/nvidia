name: latest-mutter
type: shell
commands:
  - echo "deb http://deb.debian.org/debian experimental main contrib non-free non-free-firmware" > /etc/apt/sources.list.d/debian-experimental.list
  - apt update
  - apt-cache policy mutter gnome-shell gnome-shell-extensions
  - apt-get -s -o Debug::pkgProblemResolver=yes -t experimental install mutter gnome-shell gnome-shell-extensions