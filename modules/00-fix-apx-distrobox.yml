name: fix-apx-distrobox
type: shell
commands:
  - apt-get update
  - apt-get install -y distrobox
  - mkdir -p /usr/share/apx/distrobox
  - ln -sf /usr/bin/distrobox /usr/share/apx/distrobox/distrobox
  - ln -sf /usr/bin/distrobox-create /usr/share/apx/distrobox/distrobox-create
  - ln -sf /usr/bin/distrobox-enter /usr/share/apx/distrobox/distrobox-enter
  - ln -sf /usr/bin/distrobox-export /usr/share/apx/distrobox/distrobox-export
  - ln -sf /usr/bin/distrobox-host-exec /usr/share/apx/distrobox/distrobox-host-exec
  - ln -sf /usr/bin/distrobox-init /usr/share/apx/distrobox/distrobox-init
  - ln -sf /usr/bin/distrobox-list /usr/share/apx/distrobox/distrobox-list
  - ln -sf /usr/bin/distrobox-rm /usr/share/apx/distrobox/distrobox-rm
  - ln -sf /usr/bin/distrobox-stop /usr/share/apx/distrobox/distrobox-stop
  - ln -sf /usr/bin/distrobox-upgrade /usr/share/apx/distrobox/distrobox-upgrade